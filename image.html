<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>my images</title>
    <style>
        body {

            background-image: url("restaurant.png");
            color: rgb(19, 121, 135);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
        }
        div{
            border: 5px solid black;
            height: 650px;
            width: 900px;
            border-radius: 50px;
            background-image: url("tacos2.jpg");
        }

        img {
            border: 5px solid black;
            border-radius: 50px;
            box-shadow: 10px 10px 10px #5558;
            transition: transform .5s;
            display: block;
            margin-left: auto;
            margin-right: auto;
            width: 900px;

        }

        img:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <h1> my images </h1>
    <p>these are pictures of tacos.</p>

    <div id="one">
    <p></p>
    </div>

    <img src="tacos.jpg" alt="a plate of three tacos" />
</body>

</html>
