<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>box model</title>
    <style>
        body {
            div {
                background: rgb(44, 150, 154);
                border: 10px solid rgb(44, 110, 123);
                height: 100px;
                width: 500px;
                padding: 30px;
                margin: 20px;
                border-radius: 30px;
                color: aquamarine;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            }

            #one {
                background: rgb(98, 180, 180);
                border: 10px solid rgb(51, 148, 151);
                border-bottom: 25px solid rgb(140, 206, 206);
                color: aliceblue;
                border-top-left-radius: 40%;
                border-top-right-radius: 40%;
            }

            #two {
                margin-left: auto;
                margin-right: auto;
                text-align: center;
                border-bottom: 25px solid rgb(54, 181, 181);
                width:200px;
                height:15px;
                border-top-left-radius: 40%;
                border-top-right-radius: 40%;

            }

            #three {
                background: rgb(98, 180, 180);
                border: 10px solid rgb(51, 148, 151);
                border-bottom: 25px solid rgb(140, 206, 206);
                color: aliceblue;
                border-top-left-radius: 100px;
                border-top-right-radius: 100px;
            }

            #four {
                margin-left: auto;
                margin-right: auto;
                text-align: center;
                border-bottom: 25px solid rgb(54, 181, 181);
                width:200px;
                height:15px;
                border-top-left-radius: 100px;
                border-top-right-radius: 100px;
            }
        }
    </style>
</head>

<body>
    <div id="one">
        <p>this is a box.</p>
    <div id="two">
        <p>this is a box.</p>
    </div>
    </div>
    <div id="three">
        <p>this is a box.</p>

        <div id="four">
            <p>this is a box.</p>
        </div>
    </div>
</body>

</html>
